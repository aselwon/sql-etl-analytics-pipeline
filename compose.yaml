services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shoppulse
      POSTGRES_PASSWORD: shoppulse_local
      POSTGRES_DB: shoppulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoppulse -d shoppulse"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
  pipeline:
    build: .
    environment:
      DATABASE_URL: postgresql://shoppulse:shoppulse_local@db:5432/shoppulse
    depends_on:
      db:
        condition: service_healthy
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501 --browser.gatherUsageStats=false
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      DATABASE_URL: postgresql://shoppulse:shoppulse_local@db:5432/shoppulse
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
